name: Smoke test on an Android emulator

# Builds an x86_64 release APK, launches it on an emulator, and records whether it
# keeps running, plus the crash log and a screenshot (pushed to the "smoke" branch).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK licences
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build release APK (x86_64 for the emulator)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            mkdir -p smoke
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.almualm.app -c android.intent.category.LAUNCHER 1
            sleep 30
            (adb shell pidof com.almualm.app && echo "RESULT: RUNNING" || echo "RESULT: CRASHED") | tee smoke/result.txt
            adb exec-out screencap -p > smoke/screen.png || true
            adb logcat -d > smoke/logcat-full.txt || true
            grep -E "AndroidRuntime|FATAL|ReactNativeJS|ReactNative|unknown:|Expo|almualm|SoLoader|Exception|Error:" smoke/logcat-full.txt | tail -400 > smoke/logcat.txt || true
            # Open a real post from the site by deep link and capture the post screen.
            adb shell am start -W -a android.intent.action.VIEW -d "almualm://file/18251" com.almualm.app || true
            sleep 35
            adb exec-out screencap -p > smoke/post-top.png || true
            adb shell input swipe 540 1700 540 500 600 || true
            sleep 3
            adb exec-out screencap -p > smoke/post-middle.png || true
            adb shell input swipe 540 1700 540 300 600 || true
            adb shell input swipe 540 1700 540 300 600 || true
            sleep 3
            adb exec-out screencap -p > smoke/post-bottom.png || true
            (adb shell pidof com.almualm.app && echo "POST SCREEN: RUNNING" || echo "POST SCREEN: CRASHED") | tee -a smoke/result.txt
            adb logcat -d > smoke/logcat-full.txt || true
            cat smoke/result.txt
            echo "----- crash log -----"
            grep -E -A40 "FATAL EXCEPTION|ReactNativeJS.*(Error|Invariant)|Fatal signal" smoke/logcat-full.txt | head -150 || true
      - name: Publish results to the smoke branch
        if: always()
        run: |
          [ -d smoke ] || exit 0
          cd smoke && git init -q -b smoke && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "smoke ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" smoke
    permissions:
      contents: write
