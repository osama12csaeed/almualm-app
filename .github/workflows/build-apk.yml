name: Build Android APK

# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALMUALM_SITE_URL: https://www.almualm.com
      # Your AdMob App ID (Settings → Secrets → Actions → ADMOB_ANDROID_APP_ID). Google's test ID is used until you add it.
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The Ubuntu runner already ships the Android SDK; just accept its licences.
      - name: Android SDK licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      # Push notifications: paste the content of google-services.json into the GOOGLE_SERVICES_JSON secret.
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" > google-services.json; echo "Firebase: on"; else echo "Firebase: off (no secret)"; fi

      - run: npm ci

      - name: Checks
        run: |
          npx tsc --noEmit
          npm test

      - name: Generate the Android project
        run: |
          if [ -z "$ADMOB_ANDROID_APP_ID" ]; then unset ADMOB_ANDROID_APP_ID; fi
          npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: almualm-app-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
